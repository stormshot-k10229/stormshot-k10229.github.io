name: Deploy PR previews

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - closed

concurrency:
  group: preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    name: Deploy preview of PR
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Install po4a
        run: |
          sudo apt-get update
          sudo apt-get install -y po4a

      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # Dieser Schritt löst das Problem, dass Dependabot eine veraltete Version nutzt
      - name: Downgrade npm temporarily for Dependabot compatibility
        run: npm install -g npm@10.9.2

      - name: Get URL of pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        id: url
        run: |
          {
            echo "URL<<EOF"
            gh api "repos/$GITHUB_REPOSITORY/pages" --jq ".html_url" | sed 's,/*$,,'
            echo EOF
          } >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          npm ci

      - name: List installed packages
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          npm list --depth 1

      - name: Link Sass Embedded binary for Hugo
        if: github.event.action != 'closed'
        run: |
          ln -sf ../sass-embedded/dist/bin/sass.js node_modules/.bin/sass
          chmod +x node_modules/.bin/sass

      - name: List installed scripts
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          ls -l node_modules/.bin

      - name: Create the po4a config file
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          ./po4a/scripts/create-po4a-config.sh
      - name: Create the translated files
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          ./po4a/scripts/run-po4a.sh

      - name: Build preview
        if: github.event.action != 'closed' # You might want to skip the build if the PR has been closed
        run: |
          echo "Using base URL ${{ steps.url.outputs.URL }}"
          npm run build -- \
            --baseURL "${{ steps.url.outputs.URL }}/pr-preview/pr-${{ github.event.number }}"
          rm -f public/.nojekyll

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./public/
      
      - name: Fetch Dependabot metadata
        if: github.event.action != 'closed' && github.actor == 'dependabot[bot]'
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for Dependabot PRs (Rebase)
        if: |
          github.event.action != 'closed' && 
          github.actor == 'dependabot[bot]' && 
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' || 
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

